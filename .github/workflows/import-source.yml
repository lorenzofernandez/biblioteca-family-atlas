name: Import source snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download source-2026-10-19 --pattern biblioteca-family-atlas-source.tar.gz

      - name: Replace source tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name biblioteca-family-atlas-source.tar.gz -exec rm -rf {} +
          tar -xzf biblioteca-family-atlas-source.tar.gz
          rm biblioteca-family-atlas-source.tar.gz

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Biblioteca source snapshot" || exit 0
          git push
